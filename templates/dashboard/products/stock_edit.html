{% extends "dashboard/base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>{{ title }}</h2>

    <p>
        <strong>Product:</strong>
        {{ stock_batch.product.name }}
    </p>

    <p>
        <strong>Quantity Received:</strong>
        {{ stock_batch.quantity_received }}
    </p>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Save Changes
        </button>

        <a
            href="{% url 'admin_stock_list' %}"
            class="btn btn-secondary"
        >
            Cancel
        </a>

    </form>

</div>

{% endblock %}

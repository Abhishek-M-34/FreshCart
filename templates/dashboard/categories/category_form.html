{% extends "base.html" %}

{% block title %}
    {{ title }} - FreshCart
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <h1 class="fw-bold mb-4">
                        {{ title }}
                    </h1>

                    <form method="POST">

                        {% csrf_token %}

                        {% for field in form %}

                            <div class="mb-3">

                                <label
                                    for="{{ field.id_for_label }}"
                                    class="form-label"
                                >
                                    {{ field.label }}
                                </label>

                                {{ field }}

                                {% if field.errors %}

                                    <div class="text-danger small">
                                        {{ field.errors }}
                                    </div>

                                {% endif %}

                            </div>

                        {% endfor %}


                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-success"
                            >
                                Save Category
                            </button>

                            <a
                                href="{% url 'admin_category_list' %}"
                                class="btn btn-outline-secondary"
                            >
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}

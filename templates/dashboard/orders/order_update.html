{% extends "base.html" %}

{% block title %}
    Update Order - FreshCart
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <h1 class="fw-bold mb-2">
                        Update Order #{{ order.id }}
                    </h1>

                    <p class="text-muted mb-4">
                        Change the current order status.
                    </p>


                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-4">

                            <label
                                for="{{ form.status.id_for_label }}"
                                class="form-label"
                            >
                                Order Status
                            </label>

                            {{ form.status }}

                            {% if form.status.errors %}

                                <div class="text-danger small">
                                    {{ form.status.errors }}
                                </div>

                            {% endif %}

                        </div>


                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-success"
                            >
                                Update Status
                            </button>

                            <a
                                href="{% url 'admin_order_detail' order.id %}"
                                class="btn btn-outline-secondary"
                            >
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
